[workspace]
authors = ["dataengineergaurav <ggurjar333@gmail.com>"]
channels = ["conda-forge"]
name = "open-regulatory-corpus"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
crawl = { cmd = "python -m scrapy crawl compliance -a run_id={{ run_id }}", cwd = "scraper", description = "Crawl Bronze (run: pixi run crawl run_id=2026-09-01)" }
verify-bronze = { cmd = "python scripts/verify_bronze.py", description = "Verify Bronze" }
build-silver = { cmd = "python scripts/build_silver.py", description = "Build Silver parquet" }
verify-silver = { cmd = "python scripts/verify_silver.py", description = "Verify Silver" }
verify-sources = { cmd = "python scripts/verify_sources.py", description = "Report per-source acquisition health (gaps)" }
detect-drift = { cmd = "python scripts/detect_drift.py", description = "Diff the newest Bronze run against the previous one (drift report)" }
build-changelog = { cmd = "python scripts/build_changelog.py", description = "Render a changelog from Bronze drift" }
verify = { cmd = "python scripts/verify_bronze.py && python scripts/verify_silver.py && python scripts/verify_sources.py", description = "Verify Bronze+Silver + per-source acquisition health" }
check-docs = { cmd = "python scripts/sync_published.py --check --no-about --no-hf", description = "Fail if README/HF card numbers drift from artifacts" }
sync-published = { cmd = "python scripts/sync_published.py", description = "Sync README, HF card + GitHub About from artifacts" }
pipeline = { cmd = "pixi run crawl run_id={{ run_id }} && pixi run verify-bronze && pixi run build-silver && pixi run verify-silver", description = "Full Bronze→Silver pipeline" }

[dependencies]
python = ">=3.11,<3.13"
pip = "*"
packaging = ">=23.2,<25"
scrapy = ">=2.18.0,<3"
trafilatura = ">=2.0.0,<3"
pymupdf = ">=1.28.0,<2"

[pypi-dependencies]
pandas = "==2.2.2"
datasets = "==2.20.0"
